# Quality gate rules. The gate always reads this file from the BASE branch,
# so a PR can't loosen its own rules.

model: claude-opus-5-5
effort: medium            # low | medium | high | xhigh | max

# Any finding with one of these severities fails the gate.
fail_on:
  - CRITICAL
  - HIGH

# Optional: fail when a severity shows up more than N times.
max_count:
  MEDIUM: 5

# Files not sent to Claude (git glob patterns). Keep this short:
# anything listed here is never reviewed.
ignore_paths:
  - "**/*.md"

max_diff_chars: 150000    # ~40k tokens; bigger diffs fail until Phase 6 adds chunking
